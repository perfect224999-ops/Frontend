<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- ขอบนอกวงกลมสีเขียวเข้ม -->
  <circle cx="50" cy="50" r="48" fill="#1b431e" stroke="#8cc63f" stroke-width="2.5" />
  
  <!-- ขอบในวงกลมสีเขียวอ่อน -->
  <circle cx="50" cy="50" r="41" fill="#1b431e" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- โล่ห์สีเขียวตรงกลาง -->
  <path d="M50,18 C65,18 68,26 68,36 C68,52 50,66 50,66 C50,66 32,52 32,36 C32,26 35,18 50,18 Z" fill="#2d6e38" stroke="#8cc63f" stroke-width="2" />
  
  <!-- สัญลักษณ์หัวกวางสีน้ำตาล/ทองตรงกลางโล่ห์ -->
  <g transform="translate(38, 25) scale(0.24)" fill="#ffffff">
    <!-- เขาฝั่งซ้าย -->
    <path d="M30,30 C20,15 15,10 5,12 C10,22 18,28 25,32 M25,25 C12,15 8,8 2,16 C8,22 18,28 22,28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- เขาฝั่งขวา -->
    <path d="M70,30 C80,15 85,10 95,12 C90,22 82,28 75,32 M75,25 C88,15 92,8 98,16 C92,22 82,28 78,28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- หน้ากวาง -->
    <path d="M50,30 L40,55 L42,75 L50,90 L58,75 L60,55 Z" />
    <!-- หูกวาง -->
    <path d="M37,42 C27,45 22,55 25,60 C28,60 35,53 38,48 Z" />
    <path d="M63,42 C73,45 78,55 75,60 C72,60 65,53 62,48 Z" />
    <!-- ลูกตา -->
    <circle cx="45" cy="58" r="2.5" fill="#1b431e" />
    <circle cx="55" cy="58" r="2.5" fill="#1b431e" />
  </g>

  <!-- ข้อความวงกลม "อุทยานแห่งชาติเขาใหญ่" ด้านล่าง -->
  <path id="textPath" d="M15,64 A40,40 0 0,0 85,64" fill="none" />
  <text fill="#ffffff" font-family="sans-serif" font-size="6.5" font-weight="bold" letter-spacing="1.2">
    <textPath href="#textPath" startOffset="50%" text-anchor="middle">
      อุทยานแห่งชาติเขาใหญ่
    </textPath>
  </text>
</svg>
